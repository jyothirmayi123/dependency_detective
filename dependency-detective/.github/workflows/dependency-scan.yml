# Example: fail the build on HIGH+ findings and publish results to GitHub code scanning.
name: dependency-scan
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Scan (online, with exploit signals)
        run: python -m backend.cli scan . --mode online --enrich --format sarif -o results.sarif --fail-on high
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: results.sarif }
      - name: Enforce the gate
        run: python -m backend.cli scan . --mode online --fail-on high --format markdown > /dev/null
